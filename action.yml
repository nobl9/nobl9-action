name: "Nobl9 sloctl action"
description: "Applies or deletes Nobl9 resources from YAML configuration files using sloctl"
branding:
  icon: 'target'
  color: 'blue'
inputs:
  client_id:
    description: "Client ID"
    required: true
  client_secret:
    description: "Client Secret"
    required: true
  sloctl_yml:
    description: "The path or glob pattern to the configuration in YAML format"
    required: true
  operation:
    description: "The sloctl operation to run: apply or delete"
    required: false
    default: "apply"
  dry_run:
    description: "Submits the operation to the server without changing resources"
    required: false
    default: "false"
runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - ${{ inputs.client_id }}
    - ${{ inputs.client_secret }}
    - ${{ inputs.sloctl_yml }}
    - ${{ inputs.dry_run }}
    - ${{ inputs.operation }}
